name: Extract ZIP

on:
workflow_dispatch:
push:
paths:
- "autodeploy-platform.zip"

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Extract ZIP
    run: |
      mkdir extracted
      unzip -o autodeploy-platform.zip -d extracted
      cp -an extracted/. .
      rm -rf extracted

  - name: Commit files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git diff --cached --quiet || git commit -m "Extract website ZIP"
      git push
```
