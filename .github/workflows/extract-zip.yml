name: Extract ZIP

on:
workflow_dispatch:
push:
paths:
- "autodeploy-platform.zip"
- ".github/workflows/extract-zip.yml"

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract ZIP
    run: |
      python -c 'import zipfile, os; z=zipfile.ZipFile("autodeploy-platform.zip"); [(os.makedirs(os.path.dirname(n) or ".", exist_ok=True), open(n, "wb").write(z.read(i))) for i in z.infolist() if not i.is_dir() for n in [i.filename.replace("\\", "/")] if not n.startswith("/") and ".." not in n.split("/")]'

  - name: Commit extracted files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git diff --cached --quiet || git commit -m "Extract website ZIP"
      git push
```
