name: Extract ZIP

on:
workflow_dispatch:
push:
paths:
- 'autodeploy-platform.zip'

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Extract ZIP
    run: |
      python - <<'PY'
      import zipfile, os

      with zipfile.ZipFile("autodeploy-platform.zip") as z:
          for item in z.infolist():
              name = item.filename.replace("\\", "/")
              if name.startswith("/") or ".." in name.split("/"):
                  raise ValueError("Unsafe ZIP path")
              if item.is_dir():
                  continue
              os.makedirs(os.path.dirname(name) or ".", exist_ok=True)
              with z.open(item) as src, open(name, "wb") as dst:
                  dst.write(src.read())
      PY

  - name: Commit extracted files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git diff --cached --quiet || git commit -m "Extract website ZIP"
      git push
```
